upstream monitor_it_backend {
    server 127.0.0.1:3080;
}

server {
    server_name it.franchise-fuji.ru;

    # Приём метрик от реальных пользователей сайта и приложения.
    # Публичный эндпоинт: браузер пользователя должен достучаться напрямую,
    # поэтому мимо Next.js — сразу в коллектор. CORS обрабатывает сам сервис,
    # nginx здесь не должен добавлять свои заголовки, иначе они задвоятся.
    location /rum/v1/vitals {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;

        client_max_body_size 32k;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://monitor_it_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/it.franchise-fuji.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it.franchise-fuji.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = it.franchise-fuji.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name it.franchise-fuji.ru;
    return 404;
}
